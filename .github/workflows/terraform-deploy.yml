name: Terraform Deploy

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      stacks:
        description: 'Which stacks to apply'
        required: true
        default: 'both'
        type: choice
        options: [both, aws, gcp]

permissions:
  contents: read

# Never let two applies race for the same state lock.
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.8'

jobs:
  # The two stacks reference each other: GCP needs the AWS Elastic IP, AWS needs
  # the GCP VPN gateway addresses. That cycle is broken by passing the values in
  # as secrets, which means a from-scratch build still takes two passes. AWS runs
  # first because the Elastic IP is the value GCP cannot synthesise for itself.
  aws:
    name: Apply AWS
    if: >-
      vars.ENABLE_TF_DEPLOY == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.stacks != 'gcp')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: terraform init
        run: terraform init -input=false
        working-directory: terraform/aws

      - name: terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        working-directory: terraform/aws
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}
          TF_VAR_gcp_vpn_gateway_interface0_ip: ${{ secrets.GCP_VPN_GATEWAY_IP0 }}
          TF_VAR_gcp_vpn_gateway_interface1_ip: ${{ secrets.GCP_VPN_GATEWAY_IP1 }}
          TF_VAR_vpn_shared_secret: ${{ secrets.VPN_SHARED_SECRET }}
          # Scope the OIDC trust to this repository. See terraform-pr.yml.
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}

      # Applies the saved plan, so what ships is exactly what was reviewed.
      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
        working-directory: terraform/aws

  gcp:
    name: Apply GCP
    if: >-
      always() &&
      vars.ENABLE_TF_DEPLOY == 'true' &&
      needs.aws.result != 'failure' &&
      needs.aws.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' || inputs.stacks != 'aws')
    needs: [aws]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: terraform init
        run: terraform init -input=false
        working-directory: terraform/gcp

      - name: terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        working-directory: terraform/gcp
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION || 'us-east1' }}
          TF_VAR_zone: ${{ vars.GCP_ZONE || 'us-east1-b' }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_aws_access_key_id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_eip: ${{ secrets.AWS_EIP }}
          TF_VAR_auth_token: ${{ secrets.SLACK_AUTH_TOKEN }}
          TF_VAR_aws_vpn_tunnel1_ip: ${{ secrets.AWS_VPN_TUNNEL1_IP }}
          TF_VAR_aws_vpn_tunnel2_ip: ${{ secrets.AWS_VPN_TUNNEL2_IP }}
          TF_VAR_shared_secret: ${{ secrets.VPN_SHARED_SECRET }}
          # Scope the OIDC trust to this repository. See terraform-pr.yml.
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}

      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
        working-directory: terraform/gcp

  verify:
    name: Post-deploy health
    needs: [gcp]
    if: always() && needs.gcp.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A green apply only means the resources exist. This confirms the site is
      # actually serving before the deploy is called done.
      - name: Check load balancer health endpoint
        env:
          LB_IP: ${{ secrets.LB_IP }}
        run: |
          if [ -z "$LB_IP" ]; then
            echo "LB_IP secret not set; skipping health verification"
            exit 0
          fi
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$LB_IP/health" || true)
            if [ "$status" = "200" ]; then
              echo "Load balancer healthy after $attempt attempt(s)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status"
            sleep 15
          done
          echo "Load balancer did not return 200 within the retry budget"
          exit 1
