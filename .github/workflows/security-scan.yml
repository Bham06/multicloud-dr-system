name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          # Suppress checks that are intentionally accepted in this project.
          # CKV_GCP_62: cloud-platform scope on VM — required for Secret Manager
          #              client library; actual access locked down via IAM.
          # CKV_AWS_8:  EC2 T2/T3 detailed monitoring — cost tradeoff for dev.
          skip_check: CKV_GCP_62,CKV_AWS_8
          output_format: cli
          soft_fail: false

  trivy:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on Terraform
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
