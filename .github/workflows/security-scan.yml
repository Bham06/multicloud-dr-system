name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-published advisories surface without waiting for a push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: IaC misconfiguration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          output: trivy-iac.sarif
          # HIGH,CRITICAL alone returned nothing, including for the publicly
          # reachable Cloud SQL and RDS endpoints, which Trivy rates MEDIUM. A
          # scan that is silent about known exposure is worse than no scan.
          severity: MEDIUM,HIGH,CRITICAL
          # Report rather than block. The public database endpoints are known
          # and tracked separately; failing the build on them would train
          # everyone to ignore this job.
          exit-code: '0'

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependencies:
    name: Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit Cloud Function requirements
        run: |
          status=0
          for requirements in terraform/gcp/functions/*/requirements.txt; do
            echo "::group::$requirements"
            pip-audit --requirement "$requirements" --strict || status=1
            echo "::endgroup::"
          done
          exit $status
