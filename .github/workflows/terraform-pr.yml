name: Terraform PR

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.tflint.hcl'
      - '.github/workflows/terraform-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: '1.9.8'

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform/

  validate:
    name: Validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [gcp, aws]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # -backend=false skips remote state, so this needs no cloud credentials.
      - name: terraform init
        run: terraform init -backend=false -input=false
        working-directory: terraform/${{ matrix.stack }}

      - name: terraform validate
        run: terraform validate
        working-directory: terraform/${{ matrix.stack }}

  tflint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Cache tflint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: tflint --recursive --config "$(pwd)/.tflint.hcl"

  plan:
    name: Plan (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    # Opt-in. Without cloud credentials configured a plan cannot run, and a
    # permanently red required check is a check nobody reads. Set the repository
    # variable ENABLE_TF_PLAN to 'true' once the secrets below exist.
    if: vars.ENABLE_TF_PLAN == 'true'
    strategy:
      fail-fast: false
      matrix:
        stack: [gcp, aws]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        if: matrix.stack == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation - no long-lived service account keys.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to AWS
        if: matrix.stack == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: terraform init
        run: terraform init -input=false
        working-directory: terraform/${{ matrix.stack }}

      - name: terraform plan
        run: terraform plan -input=false -lock-timeout=5m -no-color
        working-directory: terraform/${{ matrix.stack }}
        env:
          # GCP stack
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION || 'us-east1' }}
          TF_VAR_zone: ${{ vars.GCP_ZONE || 'us-east1-b' }}
          TF_VAR_aws_access_key_id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_eip: ${{ secrets.AWS_EIP }}
          TF_VAR_auth_token: ${{ secrets.SLACK_AUTH_TOKEN }}
          TF_VAR_aws_vpn_tunnel1_ip: ${{ secrets.AWS_VPN_TUNNEL1_IP }}
          TF_VAR_aws_vpn_tunnel2_ip: ${{ secrets.AWS_VPN_TUNNEL2_IP }}
          TF_VAR_shared_secret: ${{ secrets.VPN_SHARED_SECRET }}
          # AWS stack
          TF_VAR_gcp_vpn_gateway_interface0_ip: ${{ secrets.GCP_VPN_GATEWAY_IP0 }}
          TF_VAR_gcp_vpn_gateway_interface1_ip: ${{ secrets.GCP_VPN_GATEWAY_IP1 }}
          TF_VAR_vpn_shared_secret: ${{ secrets.VPN_SHARED_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}
          # Both stacks
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          # Scope the OIDC trust to this repository. Not secrets — they must
          # match the repo the workflow is running in, so they are read from the
          # event rather than configured, which keeps a fork from inheriting the
          # upstream repo's trust policy.
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
