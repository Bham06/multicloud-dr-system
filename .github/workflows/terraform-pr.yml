name: Terraform Plan (PR)

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-pr.yml'

# Cancel previous plan runs for the same PR when new commits are pushed.
# Safe here because we only want the plan for the latest commit.
concurrency:
  group: terraform-plan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # required for OIDC token exchange
  pull-requests: write   # required to post plan output as a PR comment

env:
  TF_VERSION: '1.6.6'

jobs:
  plan-gcp:
    name: Plan GCP Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/gcp

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        # continue-on-error so the comment step always runs even if plan fails
        continue-on-error: true
        run: terraform plan -no-color -input=false 2>&1 | tee plan_output.txt
        env:
          TF_VAR_project_id:            ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_github_owner:          ${{ github.repository_owner }}
          TF_VAR_github_repo:           ${{ github.event.repository.name }}
          TF_VAR_db_password:           ${{ secrets.DB_PASSWORD }}
          TF_VAR_aws_access_key_id:     ${{ secrets.AWS_SYNC_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SYNC_SECRET_ACCESS_KEY }}
          TF_VAR_aws_eip:               ${{ secrets.AWS_EIP }}
          TF_VAR_s3_bucket_name:        ${{ secrets.S3_BUCKET_NAME }}
          TF_VAR_auth_token:            ${{ secrets.SLACK_AUTH_TOKEN }}
          TF_VAR_slack_team:            ${{ secrets.SLACK_TEAM }}
          TF_VAR_domain_name:           ${{ secrets.DOMAIN_NAME }}

      - name: Post GCP plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw  = fs.readFileSync('terraform/gcp/plan_output.txt', 'utf8');
            const plan = raw.length > 60000 ? '...(truncated)\n' + raw.slice(-60000) : raw;
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';

            const marker = '<!-- gcp-plan -->';
            const body = `${marker}\n### ${status} GCP Terraform Plan\n\`\`\`hcl\n${plan}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  plan-aws:
    name: Plan AWS Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: terraform plan -no-color -input=false 2>&1 | tee plan_output.txt
        env:
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo:  ${{ github.event.repository.name }}
          TF_VAR_db_password:  ${{ secrets.DB_PASSWORD }}
          TF_VAR_admin_cidr:   ${{ secrets.ADMIN_CIDR }}
          TF_VAR_region:       ${{ secrets.AWS_REGION }}

      - name: Post AWS plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw  = fs.readFileSync('terraform/aws/plan_output.txt', 'utf8');
            const plan = raw.length > 60000 ? '...(truncated)\n' + raw.slice(-60000) : raw;
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';

            const marker = '<!-- aws-plan -->';
            const body = `${marker}\n### ${status} AWS Terraform Plan\n\`\`\`hcl\n${plan}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
