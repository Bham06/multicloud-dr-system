name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test_no_source_files_are_git_ignored shells out to git check-ignore.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # The suite includes Terraform fmt/validate checks that skip themselves
      # when the CLI is absent. Installing it here means they actually run.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Run tests
        run: pytest

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh terraform/*/scripts/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi
          printf 'Checking: %s\n' "${scripts[@]}"
          # The operator scripts are run by hand during a DR event, so style
          # nits are noise; fail only on genuine bugs.
          shellcheck --severity=warning "${scripts[@]}"
